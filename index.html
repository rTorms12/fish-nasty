<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Fish Nasty</title>
<meta name="description" content="Minnesota lake maps with DNR depth contours, fish species, fisheries surveys, stocking records and a bite forecast.">
<meta name="theme-color" content="#0b1a26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fish Nasty">
<link rel="preconnect" href="https://server.arcgisonline.com" crossorigin>
<link rel="preconnect" href="https://enterprise.gisdata.mn.gov" crossorigin>
<link rel="preconnect" href="https://maps.dnr.state.mn.us" crossorigin>
<link rel="preconnect" href="https://api.open-meteo.com" crossorigin>
<link rel="preconnect" href="https://kmfyzjasrtpgdjcybqtr.supabase.co" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-64.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" crossorigin="">
<link rel="stylesheet" href="css/app.css?v=1.9.2">
</head>
<body>
<div id="app">
  <div id="map" aria-label="Map of Minnesota lakes"></div>

  <header class="topbar">
    <button class="icon-btn avatar-btn" id="btn-profile" title="Profile" aria-label="Profile"><span class="ini"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg></button>
    <div class="search">
      <svg class="s-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="search" type="search" placeholder="Search Minnesota lakes or DOW #" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" enterkeyhint="search">
      <button id="search-clear" class="hidden" aria-label="Clear search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <button class="icon-btn" id="btn-top" title="Top 20 lakes" aria-label="Top 20 lakes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a1 1 0 0 0-1 1 4 4 0 0 0 4 4M17 6h3a1 1 0 0 1 1 1 4 4 0 0 1-4 4"/></svg></button>
  </header>
  <div id="search-results" class="search-results hidden"></div>
  <div id="zoom-hint">Zoom in to a lake to see depth contours · long-press to drop a pin</div>

  <section id="sheet" class="sheet half" aria-label="Lake details">
    <div class="sheet-handle" id="sheet-handle"><span></span></div>
    <button class="sheet-close" data-action="sheet-close" title="Close panel" aria-label="Close panel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="sheet-body" id="sheet-body"></div>
  </section>
  <button id="panel-open" class="hidden" data-action="sheet-open" title="Show panel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg><span>Panel</span></button>

  <div class="fabs" role="toolbar" aria-label="Map tools">
    <button id="fab-forecast" title="Bite forecast for this area"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16a8 8 0 0 1 16 0"/><path d="M12 16l3.5-5"/><circle cx="12" cy="16" r="1.4" fill="currentColor"/><path d="M4 20h16"/></svg><span>Bite</span></button>
    <button id="fab-pin" title="Drop a pin"><svg viewBox="0 0 24 24"><path d="M12 22s7-7.5 7-13a7 7 0 1 0-14 0c0 5.5 7 13 7 13z" fill="currentColor"/><circle cx="12" cy="9" r="2.6" fill="#0b1a26"/></svg><span>Pin</span></button>
    <button id="fab-locate" title="My location"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></svg><span>Me</span></button>
    <button id="fab-layers" title="Map layers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3.5l8.5 4.5L12 12.5 3.5 8z" fill="currentColor" fill-opacity=".25"/><path d="M3.5 12.5L12 17l8.5-4.5"/><path d="M3.5 16.5L12 21l8.5-4.5"/></svg><span>Layers</span></button>
    <button id="fab-legend" title="Depth key"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="3.4" rx="1.2" fill="#a8d4f5"/><rect x="4" y="9.2" width="16" height="3.4" rx="1.2" fill="#3f8fdf"/><rect x="4" y="14.4" width="16" height="3.4" rx="1.2" fill="#1f54a3"/><rect x="4" y="19.6" width="16" height="1.6" rx=".8" fill="#0a1b47"/></svg><span>Depths</span></button>
  </div>
  <div class="zoomctl">
    <button id="fab-zoomin" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg></button>
    <button id="fab-zoomout" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14"/></svg></button>
  </div>
  <div id="layers-panel" class="panel hidden"></div>
  <div id="pin-menu" class="panel pin-menu hidden"></div>
  <div id="place-hint" class="hidden"><span>Tap the map where you want the pin</span><button data-action="pin-cancel">Cancel</button></div>
  <div id="legend" class="legend hidden"></div>
  <div id="toast" class="toast hidden"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" crossorigin=""></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js" crossorigin=""></script>
<script>
// Sign-in library loads in the background so the map and lake pages are not held up by it
(function () {
  var srcs = ['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js', 'https://unpkg.com/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js'];
  var i = 0;
  function tryNext() {
    if (i >= srcs.length) { window.supabaseLoadFailed = true; window.dispatchEvent(new Event('supabase-failed')); return; }
    var s = document.createElement('script'); s.async = true; s.src = srcs[i++];
    s.onload = function () { if (window.supabase) window.dispatchEvent(new Event('supabase-ready')); else { window.supabaseLoadFailed = 'error'; window.dispatchEvent(new Event('supabase-failed')); } };
    s.onerror = tryNext;
    document.head.appendChild(s);
  }
  tryNext();
})();
</script>
<script src="js/config.js?v=1.9.2"></script>
<script src="js/species.js?v=1.9.2"></script>
<script src="js/dnr.js?v=1.9.2"></script>
<script src="js/weather.js?v=1.9.2"></script>
<script src="js/solunar.js?v=1.9.2"></script>
<script src="js/forecast.js?v=1.9.2"></script>
<script src="js/map.js?v=1.9.2"></script>
<script src="js/ui.js?v=1.9.2"></script>
<script src="js/views.js?v=1.9.2"></script>
<script src="js/cloud.js?v=1.9.2"></script>
<script src="js/app.js?v=1.9.2"></script>
</body>
</html>
